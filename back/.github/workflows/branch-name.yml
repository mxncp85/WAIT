name: Branch name

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le nom de la branche
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          REGEX='^T[0-9]+-[a-z0-9-]+$'
          if [[ ! "$BRANCH" =~ $REGEX ]]; then
            echo "Nom de branche invalide : $BRANCH"
            echo "Format attendu : ID du backlog + nom, ex. T25-floutage-serveur"
            exit 1
          fi
          echo "Nom de branche valide : $BRANCH"