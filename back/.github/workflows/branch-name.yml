name: Branch name

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le nom de la branche
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          REGEX='^(feat|fix|chore|docs|refactor|test|ci)/[a-z0-9._-]+$'
          if [[ ! "$BRANCH" =~ $REGEX ]]; then
            echo "Nom de branche invalide : $BRANCH"
            echo "Format attendu : feat/ma-feature, fix/mon-bug, chore/..., etc."
            exit 1
          fi
          echo "Nom de branche valide : $BRANCH"